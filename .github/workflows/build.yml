name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pio-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: native_ble_gateway
            env: esp32_ble_gateway
          - example: native_ble_gateway
            env: esp32s3_ble_gateway
          - example: native_ble_gateway
            env: esp32c3_ble_gateway
          - example: p4_ble_gateway
            env: p4_ble_gateway
          - example: c5_ble_gateway
            env: c5_ble_gateway
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Cache PlatformIO + pip
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles(format('examples/{0}/platformio.ini', matrix.example)) }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.env }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.env }}
        run: pio run -d examples/${{ matrix.example }} -e ${{ matrix.env }}
