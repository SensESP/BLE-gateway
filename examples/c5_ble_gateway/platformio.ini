; SensESP BLE gateway on Waveshare ESP32-C5-WIFI6-KIT-NXRX.
;
; Uses NimBLE (lighter on RAM than Bluedroid) with WiFi.
; Control WebSocket disabled to save internal SRAM.

[platformio]
default_envs = c5_ble_gateway

[env:c5_ble_gateway]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = espidf, arduino

board = esp32-c5-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = c5_partitions.csv

; Arduino-ESP32 drags in the RainMaker and Insights cloud stack plus a
; DSP, Modbus, Zigbee and audio collection that a BLE gateway never
; touches. Dropping them takes the embedded server certificates they
; need with them.
custom_component_remove =
    espressif/esp_insights
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_schedule
    espressif/esp_secure_cert_mgr
    espressif/esp_rcp_update
    espressif/esp_modem
    espressif/esp-dsp
    espressif/esp-modbus
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp-serial-flasher
    espressif/libsodium
    espressif/qrcode
    chmorgan/esp-libhelix-mp3

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -Werror=reorder

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D USE_ESP_IDF_LOG
    -DBOARD_HAS_PSRAM
    -D GATEWAY_HOSTNAME='"signalk-c5-ble-gw"'

lib_ldf_mode = deep

lib_deps =
    SignalK/SensESP @ ^3.5.0
    symlink://../../
