; SensESP BLE gateway on ESP32 chips with a native BLE controller.
;
; One source file, three targets: ESP32, ESP32-S3 and ESP32-C3. All
; three drive Bluedroid directly through NativeBLE — no companion
; chip and no esp_hosted transport.
;
; WiFi credentials are entered in the SensESP configuration web UI,
; so nothing network-specific is compiled in.

[platformio]
default_envs = esp32_ble_gateway

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = espidf, arduino

board_build.partitions = partitions_4mb.csv

upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -Werror=reorder

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D USE_ESP_IDF_LOG
    -D SENSESP_SSL_SUPPORT=1
    -D GATEWAY_HOSTNAME='"signalk-ble-gw"'

; Arduino-ESP32 drags in the RainMaker and Insights cloud stack plus a
; DSP, Modbus, Zigbee and audio collection that a BLE gateway never
; touches. The linker already discards them, so removing them saves
; only a few kB of flash — but it cuts the build roughly in half and
; takes with it the server certificates their CMake insists on
; embedding.
custom_component_remove =
    espressif/esp_insights
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_schedule
    espressif/esp_secure_cert_mgr
    espressif/esp_rcp_update
    espressif/esp_modem
    espressif/esp-dsp
    espressif/esp-modbus
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp-serial-flasher
    espressif/libsodium
    espressif/qrcode
    chmorgan/esp-libhelix-mp3

lib_ldf_mode = deep

lib_deps =
    SignalK/SensESP @ ^3.5.0
    symlink://../../

[env:esp32_ble_gateway]
board = esp32dev

[env:esp32s3_ble_gateway]
board = esp32-s3-devkitc-1
; The devkit carries 8 MB, but the example's partition table is sized
; for the 4 MB the other two targets have. Raise both together if you
; want the extra space.
board_upload.flash_size = 4MB

[env:esp32c3_ble_gateway]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    ; The devkit exposes the serial console over the built-in USB CDC.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
